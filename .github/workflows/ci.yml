name: CI

# The repository argues for mechanised precedence; until this workflow existed
# nothing mechanised its own (finding R4, sixth audit). Three jobs, no secrets,
# no network calls to model vendors: the paper must build, the suite must pass,
# and the Part C pipeline must reproduce its committed verdicts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: Paper builds and the style freeze holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures
      - name: Build and verify the arXiv source bundle
        run: |
          set -euo pipefail

          paper_build_dir=$(mktemp -d)
          mkdir -p "$paper_build_dir/figures"
          cp paper/crossaudit.tex "$paper_build_dir/crossaudit.tex"
          cp paper/figures/figure5-v4-configuration-effects.pdf \
            "$paper_build_dir/figures/figure5-v4-configuration-effects.pdf"
          cp paper/figures/figure6-v4-operational-tradeoffs.pdf \
            "$paper_build_dir/figures/figure6-v4-operational-tradeoffs.pdf"

          for pass in 1 2; do
            if ! (
              cd "$paper_build_dir"
              pdflatex -halt-on-error -interaction=nonstopmode crossaudit.tex \
                > "pdflatex-pass-${pass}.txt"
            ); then
              echo "pdflatex pass ${pass} failed; final output follows:"
              tail -n 100 "$paper_build_dir/pdflatex-pass-${pass}.txt"
              exit 1
            fi
          done

          if grep -qE '^!' "$paper_build_dir/crossaudit.log"; then
            echo "LaTeX reported errors:"
            grep -nE '^!' -A3 "$paper_build_dir/crossaudit.log"
            exit 1
          fi
          if grep -q 'There were undefined references' "$paper_build_dir/crossaudit.log"; then
            echo "LaTeX left undefined references after two passes."
            exit 1
          fi

          pages=$(sed -nE 's/.*\(([0-9]+) pages,.*/\1/p' \
            "$paper_build_dir/crossaudit.log" | tail -n 1)
          figures=$(grep -cF '\@writefile{lof}{\contentsline {figure}' \
            "$paper_build_dir/crossaudit.aux")
          tables=$(grep -cF '\@writefile{lot}{\contentsline {table}' \
            "$paper_build_dir/crossaudit.aux")
          references=$(grep -cF '\bibitem{' "$paper_build_dir/crossaudit.tex")

          echo "paper inventory: ${pages} pages, ${figures} figures, ${tables} tables, ${references} references"
          test "$pages" -eq 25
          test "$figures" -eq 6
          test "$tables" -eq 5
          test "$references" -eq 22
      - name: Build the anonymous top-conference pre-results manuscript
        run: |
          set -euo pipefail
          cd paper/submissions/topconf2027
          for pass in 1 2; do
            pdflatex -halt-on-error -interaction=nonstopmode crossaudit-topconf.tex \
              > "pdflatex-pass-${pass}.txt"
          done
          ! grep -qE '^!' crossaudit-topconf.log
          ! grep -q 'There were undefined references' crossaudit-topconf.log
          pages=$(sed -nE 's/.*\(([0-9]+) pages,.*/\1/p' \
            crossaudit-topconf.log | tail -n 1)
          echo "top-conference pre-results inventory: ${pages} pages"
          test "$pages" -eq 6
      - name: Assert the em-dash freeze
        run: |
          n=$(grep -c ' --- ' paper/crossaudit.tex)
          echo "file-wide ' --- ' count: $n"
          test "$n" -eq 9 || { echo "style freeze broken: expected 9, found $n"; exit 1; }

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned toolchain
        run: pip install -c constraints.txt -e '.[partC]'
      - run: pytest -q

  partC:
    name: Part C pipeline reproduces its verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned toolchain
        run: pip install -c constraints.txt -e '.[partC]'
      - name: Keep the committed matrix for comparison
        run: git show HEAD:experiment/v3/partC/results/deterministic_kill_matrix.json > /tmp/committed.json
      - name: Regenerate mutants and rerun the four channels
        working-directory: experiment/v3/partC
        run: |
          python3 mutate_code.py /tmp/mutants
          diff -r mutants /tmp/mutants
          python3 code_dcl.py /tmp/mutants > /dev/null
      - name: Compare verdicts only, ignoring the toolchain stamp
        run: |
          python3 - <<'PY'
          import json, sys
          strip = lambda d: {k: v for k, v in d.items() if k not in ("toolchain", "canary")}
          old = strip(json.load(open("/tmp/committed.json")))
          new = strip(json.load(open("experiment/v3/partC/results/deterministic_kill_matrix.json")))
          if old != new:
              print("Part C verdicts drifted from the committed matrix.")
              print("committed:", json.dumps(old.get("kills"), sort_keys=True),
                    "residue", old.get("review_only_residue"))
              print("rerun:    ", json.dumps(new.get("kills"), sort_keys=True),
                    "residue", new.get("review_only_residue"))
              sys.exit(1)
          print("verdicts identical:", json.dumps(new["kills"], sort_keys=True),
                "residue", new["review_only_residue"])
          PY
