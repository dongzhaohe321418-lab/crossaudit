name: "CrossAudit: run audit"

on:
  repository_dispatch:
    types: [crossaudit-run]

permissions:
  contents: write

env:
  SCIENCE_REPO: ${{ github.event.client_payload.science_repo }}
  SHA: ${{ github.event.client_payload.sha }}
  ROUND: ${{ github.event.client_payload.round }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # Audit Repo: Constitution, checks/, scripts/

      - uses: actions/checkout@v4   # Science Repo pinned at the audited SHA
        with:
          repository: ${{ env.SCIENCE_REPO }}
          ref: ${{ env.SHA }}
          path: science
          fetch-depth: 2
          token: ${{ secrets.AUDIT_TO_SCIENCE_TOKEN || secrets.CROSSAUDIT_DISPATCH_TOKEN }}

      - name: Dependencies
        run: pip install --quiet pyyaml

      - name: Assert vendor heterogeneity (I1)
        run: |
          python3 - <<'EOF'
          import sys, yaml
          cfg = yaml.safe_load(open("science/crossaudit.yml"))
          g, a = cfg["generator"]["vendor"], cfg["auditor"]["vendor"]
          if g == a:
              sys.exit(f"I1 violated: generator and auditor share vendor '{g}'")
          print(f"I1 ok: generator={g}, auditor={a}")
          EOF

      - name: Deterministic checks — before any LLM (I4)
        id: dcl
        run: |
          set +e
          # R2 §5: audit the full push range (before..after) when 'before' is known;
          # fall back to the commit itself. Payload is untrusted for scoping either way.
          BEFORE="${{ github.event.client_payload.before }}"
          if [ -n "$BEFORE" ] && git -C science cat-file -e "$BEFORE" 2>/dev/null; then
            git -C science diff --name-only "$BEFORE" HEAD -- experiments/ > changed.txt || true
          else
            git -C science diff --name-only HEAD^ HEAD -- experiments/ > changed.txt || true
          fi
          [ -s changed.txt ] || git -C science show --name-only --format= HEAD -- experiments/ > changed.txt
          # shellcheck disable=SC2046
          python checks/run_checks.py --science-root science \
            --changed $(cat changed.txt) --output checks.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: LLM audit (vendor B), or offline stub without a key
        env:
          AUDITOR_API_KEY: ${{ secrets.AUDITOR_API_KEY }}
          AUDITOR_MODEL: ${{ vars.AUDITOR_MODEL }}
        run: |
          EXTRA=""
          [ -z "$AUDITOR_API_KEY" ] && EXTRA="--offline"
          python scripts/run_llm_audit.py \
            --science-root science \
            --science-repo "$SCIENCE_REPO" --sha "$SHA" --round "$ROUND" \
            --constitution AUDIT_RULES.md --checks checks.json \
            --changed changed.txt \
            --out "reports/${SHA}.md" $EXTRA
          # runner derives the true round from reports/index.jsonl and writes receipt.json

      - name: Commit cycle artefacts to the ledger (I2, I7; append-only)
        id: ledger
        run: |
          git config user.name "crossaudit-bot"
          git config user.email "crossaudit-bot@users.noreply.github.com"
          git add cycles/ controller/state.json 2>/dev/null || git add cycles/
          git commit -m "cycle: ${SCIENCE_REPO}@${SHA:0:7} — $(cat verdict.txt)"
          git push
          echo "report_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "R2 §3: post admission status onto the science commit (the real gate hook)"
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TO_SCIENCE_TOKEN || secrets.CROSSAUDIT_DISPATCH_TOKEN }}
        run: |
          V=$(cat verdict.txt)
          STATE=failure; DESC="CrossAudit: $V"
          [ "$V" = "PASS" ] && STATE=success
          gh api "repos/${SCIENCE_REPO}/statuses/$(git -C science rev-parse HEAD)" \
            -f state="$STATE" -f context="crossaudit/admission" \
            -f description="$DESC" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${{ steps.ledger.outputs.report_commit }}"
          # With branch protection requiring context 'crossaudit/admission', merges and
          # protected deploys now actually block on this status — admission, not summary.

      - name: Dispatch verdict back to the Science Repo
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TO_SCIENCE_TOKEN || secrets.CROSSAUDIT_DISPATCH_TOKEN }}
        run: |
          REPORT_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${{ steps.ledger.outputs.report_commit }}/$(cat cycle_dir.txt)/report.md"
          gh api "repos/${SCIENCE_REPO}/dispatches" \
            -f event_type=crossaudit-verdict \
            -f "client_payload[verdict]=$(cat verdict.txt)" \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[round]=$(python3 -c "import json;print(json.load(open('receipt.json'))['round'])")" \
            -f "client_payload[report_commit]=${{ steps.ledger.outputs.report_commit }}" \
            -f "client_payload[audit_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[report_url]=${REPORT_URL}"
