name: "CrossAudit: trigger audit"

on:
  push:
    branches: [main]
    paths: ["experiments/**"]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed paths
        id: changed
        run: |
          paths=$(git diff --name-only HEAD^ HEAD -- experiments/ \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Dispatch crossaudit-run to the Audit Repo
        env:
          GH_TOKEN: ${{ secrets.CROSSAUDIT_DISPATCH_TOKEN }}
        run: |
          pip install --quiet pyyaml
          AUDIT_REPO=$(python3 -c "import yaml; print(yaml.safe_load(open('crossaudit.yml'))['audit']['repo'])")
          gh api "repos/${AUDIT_REPO}/dispatches" \
            -f event_type=crossaudit-run \
            -f "client_payload[science_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[changed]=${{ steps.changed.outputs.paths }}"
