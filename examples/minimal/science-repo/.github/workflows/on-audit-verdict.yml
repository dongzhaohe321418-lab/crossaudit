name: "CrossAudit: route verdict"

on:
  repository_dispatch:
    types: [crossaudit-verdict]

permissions:
  contents: read
  issues: write

env:
  VERDICT: ${{ github.event.client_payload.verdict }}
  ROUND: ${{ github.event.client_payload.round }}
  REPORT_URL: ${{ github.event.client_payload.report_url }}
  REPORT_COMMIT: ${{ github.event.client_payload.report_commit }}
  AUDIT_REPO: ${{ github.event.client_payload.audit_repo }}
  SHA: ${{ github.event.client_payload.sha }}

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4      # this repo pinned at the audited SHA
        with:
          ref: ${{ env.SHA }}
          path: audited

      - name: "I8: fetch, verify, and consume the receipt — fail closed"
        run: |
          set -e
          pip install --quiet pyyaml
          # Audit repo comes from pinned config, NEVER from the callback payload.
          AUDIT_REPO_CFG=$(python3 -c "import yaml; print(yaml.safe_load(open('crossaudit.yml'))['audit']['repo'])")
          [ "$AUDIT_REPO" = "$AUDIT_REPO_CFG" ] \
            || { echo "::error::payload audit_repo '$AUDIT_REPO' != configured '$AUDIT_REPO_CFG' — fail closed"; exit 1; }
          echo "$REPORT_COMMIT" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "::error::report_commit is not a full 40-hex SHA — fail closed"; exit 1; }
          git init -q /tmp/anchor && git -C /tmp/anchor fetch --depth 1 \
            "https://github.com/${AUDIT_REPO_CFG}.git" "$REPORT_COMMIT" \
            || { echo "::error::commit ${REPORT_COMMIT} not fetchable from ${AUDIT_REPO_CFG} — fail closed"; exit 1; }
          # Materialise the audit ledger at the fetched commit and verify EVERYTHING.
          git -C /tmp/anchor checkout -q FETCH_HEAD -- . 2>/dev/null || true
          if [ "$VERDICT" = "PASS" ]; then
            python3 /tmp/anchor/controller/verify_receipt.py \
              --receipt "/tmp/anchor/cycles/${SHA}/receipt.json" \
              --science-root audited --audit-root /tmp/anchor \
              --expect-repo "$GITHUB_REPOSITORY" --expect-sha "$SHA" \
              || { echo "::error::receipt verification failed — fail closed"; exit 1; }
          else
            test -f "/tmp/anchor/cycles/${SHA}/receipt.json" \
              || test -f "/tmp/anchor/cycles/${SHA}-r${ROUND}/receipt.json" \
              || { echo "::error::no receipt for ${SHA} at ${REPORT_COMMIT} — fail closed"; exit 1; }
          fi
          # Admission itself is enforced by the 'crossaudit/admission' commit status the
          # audit side posts, made binding via branch protection (see docs). This step
          # guarantees no downstream hook fires on an unverifiable callback.

      - name: Read max_rounds from crossaudit.yml
        id: cfg
        run: |
          pip install --quiet pyyaml
          echo "max_rounds=$(python3 -c "import yaml; print(yaml.safe_load(open('crossaudit.yml'))['loop']['max_rounds'])")" >> "$GITHUB_OUTPUT"

      - name: "DCL_ONLY → no model audit ran; admission denied by default (I8)"
        if: env.VERDICT == 'DCL_ONLY'
        run: |
          {
            echo "## CrossAudit: DCL_ONLY ⚠️"
            echo "Deterministic checks passed but NO model audit ran (no auditor key)."
            echo "Fail-closed: the increment is NOT admitted. Configure AUDITOR_API_KEY,"
            echo "or a human may override by commenting on the ledger."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "PASS → generator proceeds"
        if: env.VERDICT == 'PASS'
        run: |
          {
            echo "## CrossAudit: PASS ✅"
            echo "Increment \`${SHA:0:7}\` cleared (round ${ROUND}). Report: ${REPORT_URL}"
            echo "Hook point: trigger your Generator's next step here"
            echo "(e.g. a Claude Code action, a queue message — deployment-specific)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "BLOCKED, rounds remain → generator must revise or dispute"
        if: env.VERDICT == 'BLOCKED' && fromJSON(env.ROUND) < fromJSON(steps.cfg.outputs.max_rounds)
        run: |
          {
            echo "## CrossAudit: BLOCKED ⛔ (round ${ROUND}/${{ steps.cfg.outputs.max_rounds }})"
            echo "Report: ${REPORT_URL}"
            echo "Hook point: invoke your Generator with the report; its revision commit"
            echo "must carry the trailer \`CrossAudit-Round: $((ROUND + 1))\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "ESCALATE or rounds exhausted → open Issue for the human (I5/I6)"
        if: env.VERDICT == 'ESCALATE' || (env.VERDICT == 'BLOCKED' && fromJSON(env.ROUND) >= fromJSON(steps.cfg.outputs.max_rounds))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create crossaudit-escalation --color D93F0B \
            --description "CrossAudit human escalation" --force
          gh issue create \
            --title "CrossAudit escalation: ${SHA:0:7} (round ${ROUND})" \
            --label crossaudit-escalation \
            --body "$(printf 'Verdict: %s at round %s/%s.\nAudit report: %s\n\nThe loop is halted for this increment only; running compute jobs are unaffected (I6). Please review the report and either amend the increment, amend the Constitution, or overrule with a written note.' "$VERDICT" "$ROUND" "${{ steps.cfg.outputs.max_rounds }}" "$REPORT_URL")"
