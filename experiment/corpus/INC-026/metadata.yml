objective: "Pilot increment: counterpoise-corrected binding energy of the HF dimer at PBE/def2-SVP. Synthetic corpus item."
inputs:
  - geometries/026.xyz
  - scripts/run_026.py
method:
  functional: "PBE"
  basis_set: "def2-SVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c026beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_026.py"
