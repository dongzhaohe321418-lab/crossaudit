objective: "Pilot increment: counterpoise-corrected binding energy of the HF dimer at wB97X-D/def2-SVP. Synthetic corpus item."
inputs:
  - geometries/007.xyz
  - scripts/run_007.py
method:
  functional: "wB97X-D"
  basis_set: "def2-SVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c007beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_007.py"
