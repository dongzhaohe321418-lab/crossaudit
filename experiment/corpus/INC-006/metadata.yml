objective: "Pilot increment: counterpoise-corrected binding energy of the formic acid dimer at wB97X-D/def2-SVP. Synthetic corpus item."
inputs:
  - geometries/006.xyz
  - scripts/run_006.py
method:
  functional: "wB97X-D"
  basis_set: "def2-SVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c006beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_006.py"
