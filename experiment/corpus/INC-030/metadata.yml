objective: "Pilot increment: counterpoise-corrected binding energy of the methane--water complex at wB97X-D/def2-TZVP. Synthetic corpus item."
inputs:
  - geometries/030.xyz
  - scripts/run_030.py
method:
  functional: "wB97X-D"
  basis_set: "def2-TZVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c030beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_030.py"
