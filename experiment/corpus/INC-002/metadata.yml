objective: "Pilot increment: counterpoise-corrected binding energy of the benzene--water complex at PBE/def2-SVP. Synthetic corpus item."
inputs:
  - geometries/002.xyz
  - scripts/run_002.py
method:
  functional: "PBE"
  basis_set: "def2-SVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c002beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_002.py"
