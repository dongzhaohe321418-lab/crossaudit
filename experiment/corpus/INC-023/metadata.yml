objective: "Pilot increment: counterpoise-corrected binding energy of the HF dimer at PBE/cc-pVDZ. Synthetic corpus item."
inputs:
  - geometries/023.xyz
  - scripts/run_023.py
method:
  functional: "PBE"
  basis_set: "cc-pVDZ"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c023beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_023.py"
