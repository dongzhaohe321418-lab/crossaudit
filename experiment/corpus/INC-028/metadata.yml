objective: "Pilot increment: counterpoise-corrected binding energy of the methane--water complex at PBE0/cc-pVDZ. Synthetic corpus item."
inputs:
  - geometries/028.xyz
  - scripts/run_028.py
method:
  functional: "PBE0"
  basis_set: "cc-pVDZ"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c028beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_028.py"
