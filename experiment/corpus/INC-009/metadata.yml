objective: "Pilot increment: counterpoise-corrected binding energy of the HF dimer at PBE0/def2-TZVP. Synthetic corpus item."
inputs:
  - geometries/009.xyz
  - scripts/run_009.py
method:
  functional: "PBE0"
  basis_set: "def2-TZVP"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c009beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_009.py"
