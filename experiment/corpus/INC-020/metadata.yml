objective: "Pilot increment: counterpoise-corrected binding energy of the formic acid dimer at PBE/cc-pVDZ. Synthetic corpus item."
inputs:
  - geometries/020.xyz
  - scripts/run_020.py
method:
  functional: "PBE"
  basis_set: "cc-pVDZ"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c020beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_020.py"
