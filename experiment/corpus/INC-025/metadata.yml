objective: "Pilot increment: counterpoise-corrected binding energy of the formic acid dimer at PBE0/cc-pVDZ. Synthetic corpus item."
inputs:
  - geometries/025.xyz
  - scripts/run_025.py
method:
  functional: "PBE0"
  basis_set: "cc-pVDZ"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
code_version: "c025beef"
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_025.py"
