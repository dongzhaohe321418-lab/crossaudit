objective: "Pilot increment: counterpoise-corrected binding energy of the ammonia dimer at B3LYP/cc-pVDZ. Synthetic corpus item."
inputs:
  - geometries/018.xyz
  - scripts/run_018.py
method:
  functional: "B3LYP"
  basis_set: "cc-pVDZ"
  corrections:
    - counterpoise
  thresholds:
    scf: 1e-06
environment: "container:demo/psi4:1.9"
exclusions: []
rerun: "python run_018.py"
